policy_inference:
  ros__parameters:
    checkpoint_path: "data/imitation_runs/bc_state/best.pt"
    publish_commands: false
    inference_rate_hz: 10.0
    stale_joint_state_sec: 0.5
    max_joint_step_rad: 0.08
    gripper_open_threshold: 0.5

    joint_states_topic: "/joint_states"
    right_joint_command_topic: "/right_joint_command"
    right_gripper_topic: "/open_right_gripper"

    right_arm_joint_names:
      - right_base_pitch_joint
      - right_shoulder_roll_joint
      - right_shoulder_yaw_joint
      - right_elbow_pitch_joint
      - right_wrist_pitch_joint
      - right_wrist_yaw_joint
    right_gripper_name: "right_gripper1_joint"
