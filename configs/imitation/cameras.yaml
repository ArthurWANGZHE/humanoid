wrist_camera:
  required: true
  driver: v4l2_camera
  fallback_driver: opencv
  video_device: /dev/video0
  image_width: 640
  image_height: 480
  fps: 30
  namespace: right_wrist_camera
  image_topic: /right_wrist_camera/image_raw
  camera_info_topic: /right_wrist_camera/camera_info

head_camera:
  required: false
  driver: realsense2_camera
  namespace: head_camera
  image_topic: /head_camera/color/image_raw
  camera_info_topic: /head_camera/color/camera_info
  alternate_image_topics:
    - /camera/camera/color/image_raw
  alternate_camera_info_topics:
    - /camera/camera/color/camera_info
