   <g id="text_5">
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', sans-serif" transform="translate(129.81793 91.00545)">noisy_action</text>
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', sans-serif" transform="translate(76.382656 102.923497)">[B, pred_horizon=16, action_dim=6]</text>
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', sans-serif" transform="translate(120.539844 114.841544)">flatten -&gt; [B, 96]</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', sans-serif" transform="translate(374.239336 91.037364)">cond  (robot_state)</text>
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', sans-serif" transform="translate(341.086563 102.955411)">[B, obs_horizon=2, state_dim=12]</text>
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', sans-serif" transform="translate(380.009844 114.873458)">flatten -&gt; [B, 24]</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', sans-serif" transform="translate(635.048633 91.073731)">timestep  t  [B]</text>
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', sans-serif" transform="translate(591.055469 102.92795)">-&gt; SinusoidalEmbedding(dim=64)</text>
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', sans-serif" transform="translate(647.171523 114.837091)">-&gt; [B, 64]</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', sans-serif" transform="translate(359.336953 181.435702)">torch.cat([x, c, te], dim=1)</text>
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', sans-serif" transform="translate(364.553789 193.28992)">[B, 96 + 24 + 64 = 184]</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', sans-serif; text-anchor: middle" x="417.33" y="245.574811" transform="rotate(-0 417.33 245.574811)">Linear(184 -&gt; 256)  +  ReLU</text>
   </g>
   <g id="text_10">
