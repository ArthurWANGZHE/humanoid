   </g>
   <g id="text_12">
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', sans-serif" transform="translate(309.540625 474.972716)">reshape -&gt; [B, pred_horizon=16, action_dim=6]</text>
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', sans-serif" transform="translate(392.579531 486.890763)">pred_noise</text>
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', sans-serif" transform="translate(334.422461 499.272677)">训练时：MSE(pred_noise, true_noise)</text>
   </g>
   <g id="text_13">
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', sans-serif" transform="translate(635.80043 195.108657)">SinusoidalEmbedding</text>
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', sans-serif" transform="translate(627.963672 207.017797)">─────────────────</text>
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', sans-serif" transform="translate(653.920195 219.011176)">half_dim = 32</text>
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', sans-serif" transform="translate(617.733359 231.068383)">freqs = exp(-k * log10000/31)</text>
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', sans-serif" transform="translate(651.152578 243.116684)">args = t * freqs</text>
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', sans-serif" transform="translate(623.370273 255.025825)">emb = [sin(args), cos(args)]</text>
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', sans-serif" transform="translate(663.911523 266.934965)">-&gt; [B, 64]</text>
   </g>
