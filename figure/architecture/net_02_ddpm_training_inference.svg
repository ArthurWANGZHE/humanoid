    <text style="font-weight: 700; font-size: 11px; font-family: 'Microsoft YaHei', sans-serif; text-anchor: start" x="33.984" y="53.753788" transform="rotate(-0 33.984 53.753788)">训练阶段  (Forward Diffusion + Denoising)</text>
   </g>
   <g id="text_3">
    <g id="patch_26">
     <path d="M 32.334 302.1276 
