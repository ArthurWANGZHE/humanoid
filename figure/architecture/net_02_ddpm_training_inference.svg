" style="fill: #ffffff"/>
    </g>
    <text style="font-weight: 700; font-size: 11px; font-family: 'Microsoft YaHei', sans-serif; text-anchor: start" x="33.984" y="297.743069" transform="rotate(-0 33.984 297.743069)">推理阶段  (Reverse Diffusion  T=100 步)</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', sans-serif" transform="translate(97.240039 103.681102)">clean action  a0</text>
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', sans-serif" transform="translate(113.140664 115.53532)">[B, 16, 6]</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', sans-serif" transform="translate(313.971289 97.753992)">eps ~ N(0, I)</text>
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', sans-serif" transform="translate(323 109.608211)">高斯噪声</text>
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', sans-serif" transform="translate(322.390664 121.46243)">[B, 16, 6]</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', sans-serif" transform="translate(517.614063 97.502205)">noise schedule</text>
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', sans-serif" transform="translate(505.491914 109.79617)">beta_1...beta_T  线性</text>
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', sans-serif" transform="translate(519.865859 121.714217)">[1e-4 -&gt; 0.02]</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', sans-serif" transform="translate(98.224922 180.795242)">noisy action  at</text>
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', sans-serif" transform="translate(92.0425 192.704383)">= sqrt(a_bar_t)*a0</text>
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', sans-serif" transform="translate(82.129102 204.62243)">  + sqrt(1-a_bar_t)*eps</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', sans-serif" transform="translate(355.372305 186.864852)">DiffusionPolicy(at, cond, t)  -&gt;  eps_pred</text>
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', sans-serif" transform="translate(427.015664 198.782898)">[B, 16, 6]</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', sans-serif" transform="translate(386.216133 245.021188)">Loss = MSE(eps_pred, eps)</text>
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', sans-serif" transform="translate(373.456445 256.939234)">-&gt; AdamW  lr=1e-4  epochs=50</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', sans-serif" transform="translate(107.300391 330.601992)">aT ~ N(0, I)</text>
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', sans-serif" transform="translate(104.25 342.456211)">纯噪声初始化</text>
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', sans-serif" transform="translate(113.335859 354.31043)">[1, 16, 6]</text>
   </g>
   <g id="text_11">
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', sans-serif" transform="translate(412.899258 330.500498)">for t = T-1 ... 0:</text>
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', sans-serif" transform="translate(357.427422 342.493877)">  eps_pred = DiffusionPolicy(at, cond, t)</text>
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', sans-serif" transform="translate(381.758555 354.411924)">  a(t-1) = DDPM reverse step</text>
   </g>
   <g id="text_12">
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', sans-serif" transform="translate(105.527305 414.145102)">a0  预测动作</text>
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', sans-serif" transform="translate(113.335859 425.99932)">[1, 16, 6]</text>
   </g>
   <g id="text_13">
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', sans-serif" transform="translate(427.625 408.186078)">反归一化</text>
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', sans-serif" transform="translate(369.070117 420.040297)">a = a0 * action_std + action_mean</text>
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', sans-serif" transform="translate(394.250313 431.958344)">-&gt; 关节角度序列  [16, 6]</text>
   </g>
   <g id="text_14">
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei', sans-serif; text-anchor: middle" x="446.625" y="478.432648" transform="rotate(-0 446.625 478.432648)">取前 N 步执行  -&gt;  servo_node  -&gt;  真实机器人</text>
   </g>
  </g>
